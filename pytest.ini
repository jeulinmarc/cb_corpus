[pytest]
# Network guard. Every parser here takes a duck-typed `fetcher` and every test
# hands it a fake one, so the suite has always been network-free — but only by
# convention: nothing stopped a test (or a refactor) from building a real
# cb_corpus.http.Fetcher and quietly crawling a central bank's website from a
# CI runner. `--disable-socket` (pytest-socket, see requirements-dev.txt) makes
# it a rule: socket.socket is dead for every test, so an accidental live fetch
# fails loudly instead of succeeding. It is set here rather than from a session
# fixture in conftest.py because pytest-socket re-enables sockets in its own
# per-test teardown hook — only the plugin's per-test setup (which this option
# drives) keeps the guard up for the WHOLE run. A test that legitimately needs
# a socket opts back in with @pytest.mark.enable_socket (none does today).
addopts = --disable-socket
